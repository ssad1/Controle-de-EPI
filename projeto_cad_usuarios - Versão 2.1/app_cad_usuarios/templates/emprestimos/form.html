{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container mt-4">

  <!-- Faixa preta no topo -->
  <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-dark text-white rounded">
    <h2 class="mb-0">{{ titulo }}</h2>
    <a href="{% url 'lista_emprestimos' %}" class="btn btn-light">Voltar</a>
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="card shadow-sm">
      <div class="card-body">

        <div class="mb-3">
          <label for="id_colaborador" class="form-label">Colaborador</label>
          {{ form.colaborador }}
        </div>

        <div class="mb-3">
          <label for="id_epi" class="form-label">EPI</label>
          {{ form.epi }}
        </div>

        <div class="mb-3">
          <label for="id_quantidade" class="form-label">Quantidade</label>
          {{ form.quantidade }}
        </div>

        <!-- Campo de data de empréstimo -->
        <div class="mb-3">
          <label for="id_data_emprestimo" class="form-label">Data do Empréstimo</label>
          {{ form.data_emprestimo }}
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success me-2">Salvar</button>
          <a href="{% url 'lista_emprestimos' %}" class="btn btn-secondary">Cancelar</a>
        </div>

      </div>
    </div>
  </form>
</div>
{% endblock %}
