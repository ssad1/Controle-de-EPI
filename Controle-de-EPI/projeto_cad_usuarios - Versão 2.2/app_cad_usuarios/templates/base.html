<!DOCTYPE html>
<html lang="pt-br">
<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de EPIs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'lista_epis' %}">Controle de EPIs</a>
     
      <form action="{% url 'buscar_universal' %}" method="get" class="d-flex">
        <input class="form-control me-2"
               type="search"
               name="q"
               placeholder="Buscar..."
               value="{{ q|default:'' }}"
               required>
    
        <input type="hidden" name="from" value="{{ from|default:request.path }}">
    
        <button class="btn btn-outline-light" type="submit">Buscar</button>
    </form>
    
       

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'lista_epis' %}">EPIs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/colaboradores' in request.path %}active{% endif %}" href="{% url 'lista_colaboradores' %}">Colaboradores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/emprestimos' in request.path %}active{% endif %}" href="{% url 'lista_emprestimos' %}">Empréstimos</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  
  <!-- Conteúdo principal -->
  <div class="container mt-4">
    {% block content %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
