{% extends 'base.html' %}

{% block title %}{% if epi %}Editar EPI{% else %}Novo EPI{% endif %}{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="card-title mb-4">{% if epi %}Editar EPI{% else %}Cadastrar Novo EPI{% endif %}</h3>

        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" name="nome" value="{{ epi.nome|default_if_none:'' }}" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Categoria</label>
                <input type="text" name="categoria" value="{{ epi.categoria|default_if_none:'' }}" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">Quantidade</label>
                <input type="number" name="quantidade" value="{{ epi.quantidade|default_if_none:'' }}" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">Validade</label>
                <input type="date" name="validade" value="{{ epi.validade|date:'Y-m-d' }}" class="form-control">
            </div>

            <div class="col-md-12">
                <label class="form-label">Observações</label>
                <textarea name="observacoes" class="form-control" rows="3">{{ epi.observacoes|default_if_none:'' }}</textarea>
            </div>

            <div class="col-12 mt-3">
                <button type="submit" class="btn btn-success">Salvar</button>
                
                <a href="{% url 'lista_epis' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
